# Manual trigger only: pressing "Run workflow" is the deployment approval.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'preview or production'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx wrangler d1 migrations apply spcfz-licence-card --remote --env ""
          else
            npx wrangler d1 migrations apply spcfz-licence-card-preview --env preview --remote
          fi
      - name: Deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            npx wrangler deploy --env ""
          else
            npx wrangler deploy --env preview
          fi
