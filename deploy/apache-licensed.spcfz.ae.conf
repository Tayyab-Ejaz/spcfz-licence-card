# /www/server/panel/vhost/apache/licensed.spcfz.ae.conf on 13.206.34.102 (aaPanel Apache).
# Proxies licensed.spcfz.ae to the spcfz-licence-card container on 127.0.0.1:8787.
# Only Cloudflare may connect: the <Location /> block below lists Cloudflare's ranges (deploy/cloudflare-ips.txt).
# mod_remoteip is not enabled on this server, so Require ip sees the real connecting address (Cloudflare's edge).
# Certificate: a copy of the *.spcfz.ae Cloudflare Origin certificate already used by coworking.spcfz.ae.
# Added by hand, not through the aaPanel UI; it does not appear in aaPanel's site list. Remove by deleting this
# file and running /etc/init.d/httpd reload.

<VirtualHost *:80>
    ServerName licensed.spcfz.ae
    ErrorLog "/www/wwwlogs/licensed.spcfz.ae-error_log"
    CustomLog "/www/wwwlogs/licensed.spcfz.ae-access_log" combined
    <Location />
        <RequireAny>
        Require ip 173.245.48.0/20
        Require ip 103.21.244.0/22
        Require ip 103.22.200.0/22
        Require ip 103.31.4.0/22
        Require ip 141.101.64.0/18
        Require ip 108.162.192.0/18
        Require ip 190.93.240.0/20
        Require ip 188.114.96.0/20
        Require ip 197.234.240.0/22
        Require ip 198.41.128.0/17
        Require ip 162.158.0.0/15
        Require ip 104.16.0.0/13
        Require ip 104.24.0.0/14
        Require ip 172.64.0.0/13
        Require ip 131.0.72.0/22
        Require ip 2400:cb00::/32
        Require ip 2606:4700::/32
        Require ip 2803:f800::/32
        Require ip 2405:b500::/32
        Require ip 2405:8100::/32
        Require ip 2a06:98c0::/29
        Require ip 2c0f:f248::/32
        </RequireAny>
    </Location>
    RewriteEngine on
    RewriteRule (.*) https://licensed.spcfz.ae$1 [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName licensed.spcfz.ae
    ErrorLog "/www/wwwlogs/licensed.spcfz.ae-error_log"
    CustomLog "/www/wwwlogs/licensed.spcfz.ae-access_log" combined

    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/licensed.spcfz.ae/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/licensed.spcfz.ae/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder On

    <Location />
        <RequireAny>
        Require ip 173.245.48.0/20
        Require ip 103.21.244.0/22
        Require ip 103.22.200.0/22
        Require ip 103.31.4.0/22
        Require ip 141.101.64.0/18
        Require ip 108.162.192.0/18
        Require ip 190.93.240.0/20
        Require ip 188.114.96.0/20
        Require ip 197.234.240.0/22
        Require ip 198.41.128.0/17
        Require ip 162.158.0.0/15
        Require ip 104.16.0.0/13
        Require ip 104.24.0.0/14
        Require ip 172.64.0.0/13
        Require ip 131.0.72.0/22
        Require ip 2400:cb00::/32
        Require ip 2606:4700::/32
        Require ip 2803:f800::/32
        Require ip 2405:b500::/32
        Require ip 2405:8100::/32
        Require ip 2a06:98c0::/29
        Require ip 2c0f:f248::/32
        </RequireAny>
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8787/ retry=0
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
